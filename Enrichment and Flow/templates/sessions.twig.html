{% if sessions %}
<div class="flex items-center gap-4">

    {% for session in sessions %}

    <div class="">

        <span class="mr-2 text-xxs text-gray-600 w-12">
            {{ session.block }}
        </span>

        {% if session.locked == 'Y' %}
            <span title="{{ __('Locked') }}" class="mr-2">{{ icon('solid', 'lock-closed', 'size-4 text-gray-600 align-middle' ) }}</span>
        {% endif %}

        <span class="tag {{ types[session.type] }}" title="{{ session.teachers }}">
            {{ session.facility }} - {{ session.focus }}
        </span>
    </div>
    {% endfor %}

    
</div>
{% endif %}
